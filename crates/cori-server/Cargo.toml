[package]
name = "cori-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Cori single-org server: bundles, endpoints, approvals, registry, console"
readme = "../../README.md"
keywords = ["workflow", "temporal", "mcp", "agents"]
categories = ["development-tools"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
axum.workspace = true
tower-http.workspace = true
tower.workspace = true
sqlx.workspace = true
futures.workspace = true
rusty-s3.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
hmac = "0.13"
urlencoding = "2"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "smtp-transport", "builder", "tokio1-rustls-tls"] }
hex.workspace = true
base64.workspace = true
toml.workspace = true
walkdir.workspace = true
mime_guess = "2"
tar.workspace = true
zstd.workspace = true
aes-gcm.workspace = true
rand.workspace = true
async-stream = "0.3"
chrono-tz.workspace = true
temporalio-client.workspace = true
cori-compiler.workspace = true
cori-engine.workspace = true
cori-store.workspace = true

[dev-dependencies]
rsa = { version = "0.9", features = ["pem", "getrandom"] }
