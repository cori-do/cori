# cargo-about: the licences of the crates in the `cori` binary, for THIRD-PARTY-NOTICES.md (scripts/cli-notices.sh).
# A crate under a licence missing here fails the release: read its terms before adding it. The Temporal SDK's crates name
# a licence file rather than a licence (its warnings): their LICENSE.txt is the MIT licence, which cargo-about recognises.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "OpenSSL",
  "CC0-1.0",
  "0BSD",
  "MPL-2.0",
]
# the platforms the binary is released for (packages/cli/pack.mjs)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
