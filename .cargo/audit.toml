# `cargo audit` (and the CI audit job) configuration.
[advisories]
ignore = [
  # RUSTSEC-2023-0071, `rsa` (Marvin attack: timing side channel on RSA private-key operations). No patched version
  # exists. `rsa` is only in the lockfile through cori-server's dev-dependencies (the dev IdP example and the auth tests
  # sign throwaway JWTs with it) and through `sqlx-mysql`, an optional sqlx backend Cori never enables; neither reaches
  # the release binary. Revisit if a runtime dependency starts pulling in `rsa`.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0459, `libsqlite3-sys` (its bundled SQLite, before 3.54.0, can return uninitialized page-cache memory for
  # a crafted database and `-wal` pair). Patched in 0.39, which no sqlx release accepts yet: sqlx-sqlite 0.9.0 takes
  # `>=0.30.1, <0.38.0`. `libsqlite3-sys` is only in the lockfile through `sqlx-sqlite`, an optional sqlx backend Cori
  # never enables, so nothing builds it (`cargo tree -i libsqlite3-sys --workspace --all-features --target all` prints
  # nothing). Revisit when sqlx accepts 0.39, or if a dependency starts linking SQLite.
  "RUSTSEC-2026-0459",
]
